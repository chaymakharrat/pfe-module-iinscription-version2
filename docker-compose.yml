version: "3.8"

services:
  # ==================== KEYCLOAK ====================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    networks:
      - inscription-network

  # ==================== CAMUNDA ====================
  camunda:
    image: camunda/camunda-bpm-platform:run-latest
    container_name: camunda
    ports:
      - "8085:8085"
    environment:
      CAMUNDA_BPM_ADMIN_USER_ID: admin
      CAMUNDA_BPM_ADMIN_USER_PASSWORD: admin
    networks:
      - inscription-network

  # ==================== NEXTCLOUD ====================
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    ports:
      - "8082:80"  # Nextcloud sur le port 8082 (8080 est pris par Keycloak)
    environment:
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=nextcloud123
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin123
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost nextcloud
    volumes:
      - nextcloud_data:/var/www/html
      - nextcloud_custom_apps:/var/www/html/custom_apps
      - nextcloud_config:/var/www/html/config
      - nextcloud_documents:/var/www/html/data
    depends_on:
      - nextcloud-db
    networks:
      - inscription-network
    restart: unless-stopped

  # ==================== NEXTCLOUD DATABASE ====================
  nextcloud-db:
    image: mysql:8.0
    container_name: nextcloud-db
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=nextcloud123
    volumes:
      - nextcloud_db:/var/lib/mysql
    networks:
      - inscription-network
    restart: unless-stopped

networks:
  inscription-network:
    driver: bridge

volumes:
  nextcloud_data:
  nextcloud_custom_apps:
  nextcloud_config:
  nextcloud_documents:
  nextcloud_db: